# MongoDB stores accounts, project records, parsed geometry and original drawings.
# Place an HTTPS reverse proxy in front of localhost:3000.
services:
  formiq:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI}
      MONGODB_DB: ${MONGODB_DB:-formiq}
      FORMIQ_DEMO: "false"
      FORMIQ_SECURE_COOKIES: "true"
      FORMIQ_APP_URL: ${FORMIQ_APP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      PASSWORD_RESET_FROM: ${PASSWORD_RESET_FROM:-}
    restart: unless-stopped
